[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avocado-ripeness"
version = "0.1.0"
description = "Avocado ripeness estimation from images"
readme = "README.md"
authors = [
    { name = "Your Name" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.66",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
    "flake8",
    "autopep8",
]
mobile = [
    "executorch>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
